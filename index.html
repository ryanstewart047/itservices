<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Down</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #338F7A;
            --primary-dark: #266d5d;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(51, 143, 122, 0.25) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(38, 109, 93, 0.2) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            padding: 1.5rem;
            overflow-x: hidden;
        }

        .maintenance-container {
            max-width: 580px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-wrapper {
            margin-bottom: 2rem;
            display: inline-block;
        }

        .logo-wrapper img {
            max-height: 70px;
            width: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(51, 143, 122, 0.15);
            border: 1px solid rgba(51, 143, 122, 0.4);
            color: #4ade80;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.25;
            color: #ffffff;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, rgba(51, 143, 122, 0.2), rgba(38, 109, 93, 0.4));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            border: 1px solid rgba(51, 143, 122, 0.3);
        }

        .icon-box i {
            font-size: 2.25rem;
            color: var(--primary);
        }

        .contact-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 1.5rem;
        }

        .contact-card i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .contact-card a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .contact-card a:hover {
            color: var(--primary);
        }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.6);
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="logo-wrapper">
            <img src="assets/img/logo-white.png" alt="EARPI Logo" onerror="this.onerror=null; this.src='assets/img/logo.png';">
        </div>

        <div class="icon-box">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>

        <div class="status-badge">
            <span class="pulse-dot"></span>
            Website down
        </div>

        <h1>Unexpected Error!!</h1>
        <p>Site is experencing unexpected error.</p>

        <div class="contact-card">
            <i class="fa-envelope fa-regular"></i>
            <span>Contact the developer for this site. <a href="mailto:support@itservicesfreetown.com">support@itservicesfreetown.com</a></span>
        </div>

        <div class="footer-text">
            &copy; 2026 EARPI. All rights reserved.
        </div>
    </div>
</body>
</html>
